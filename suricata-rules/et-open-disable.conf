# suricata-update disable filters for the ET Open source.
# Re-apply after every refresh:
#   suricata-update -o suricata-rules/et-open --no-test -f --disable-conf suricata-rules/et-open-disable.conf
#
# Rationale: w4rya monitors an isolated Attack/Defense CTF network, not the
# open internet. Two classes of ET Open content are near-pure noise here:
#   1. Decoder-level checksum-validation events -- fire on any pcap without
#      hardware-computed checksums (common with crafted/replayed test pcaps),
#      not an attack signal.
#   2. External-threat-intel reputation lists and consumer-malware categories
#      (botnets, Tor exit nodes, dynamic-DNS providers, phishing kits,
#      adware, mobile malware, P2P/file-sharing, chat/IRC, SCADA, VoIP,
#      games) -- these describe real-internet threats a team VM inside a
#      contained game VPN essentially never generates or receives.
# Everything else (exploit/web/sql/malware/C2/scan/hunting/info/user_agents/
# ja3/dns/attack_response/shellcode/current_events) stays enabled: that's
# where actual exploit and C2 signal for this use case lives.
#
# Protocol-specific groups (ftp/tftp/telnet/pop3/imap/smtp/snmp/rpc/activex/
# icmp/netbios) are left enabled for now -- prune these per-competition based
# on which protocols the fielded services actually speak.

# 1. Decoder checksum noise
2200073
2200074
2200075
2200076
2200077
2200078
2200079

# 2. External reputation / consumer-malware categories, irrelevant on an
#    isolated CTF network
