version: "3.5"
services:
  timescale:
    build: services/timescale
    image: w4rya-timescale:latest
    restart: unless-stopped
    volumes:
    - timescale-data:/var/lib/postgresql/data
    - ./services/schema/system.sql:/docker-entrypoint-initdb.d/100_system.sql:ro
    - ./services/schema/functions.sql:/docker-entrypoint-initdb.d/101_functions.sql:ro
    - ./services/schema/schema.sql:/docker-entrypoint-initdb.d/102_schema.sql:ro
    - ./services/schema/app_config.sql:/docker-entrypoint-initdb.d/200_app_config.sql:ro
    - ./services/schema/notes.sql:/docker-entrypoint-initdb.d/201_notes.sql:ro
    - ./services/schema/audit.sql:/docker-entrypoint-initdb.d/202_audit.sql:ro
    networks:
      - internal
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: w4rya
      POSTGRES_DB: w4rya
    # Postgres uses shared memory for caching; docker assigns just 64 MB by
    # default which is too small for the Timescale extension. These limits are
    # sized so the whole stack fits in ~6 GB (they used to sum to 8 GB, which
    # oversubscribes a typical 7-8 GB CTF laptop). Bump them if you have RAM to
    # spare and notice the cache thrashing.
    shm_size: '1g'
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w4rya -d w4rya || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile-frontend
    image: w4rya-frontend:latest
    restart: unless-stopped
    ports:
      # Parameterised so install.sh can move the UI off a busy port. The
      # default matches what the README and install.sh print.
      - "${W4RYA_UI_PORT:-3001}:3000"
    expose:
      - 3000
    depends_on:
      - timescale
      - api
    networks:
      - internal
    environment:
      API_SERVER_ENDPOINT: http://api:5000/
      VIRTUAL_HOST: w4rya.local

  api:
    build:
      context: services/api
      dockerfile: Dockerfile-api
    image: w4rya-api:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro
      # rw so the add_user.py bootstrap script can write users.yaml from
      # inside the container. The api code only reads it.
      - ./auth:/app/auth
      # suricata rules editable from the UI. Mounted rw on both api (writes)
      # and suricata (reads via docker-compose-suricata.yml).
      - ./suricata-rules:/app/suricata-rules
      # suricata command socket directory (B1 auto-reload). Empty when running
      # the main compose alone; populated by suricata in the -suricata variant.
      - ./suricata-run:/var/run/suricata
    environment:
      TIMESCALE: ${TIMESCALE}
      W4RYA_TRAFFIC_DIR: ${TRAFFIC_DIR_DOCKER}
      W4RYA_SECRET_KEY: ${W4RYA_SECRET_KEY}
      W4RYA_COOKIE_SECURE: ${W4RYA_COOKIE_SECURE:-}
      W4RYA_LOG_LEVEL: ${W4RYA_LOG_LEVEL:-INFO}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      VM_IP: ${VM_IP}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m

  flagids:
    restart: unless-stopped
    build:
      context: services/flagids
    image: w4rya-flagids:latest
    depends_on:
      - timescale
    networks:
      - internal
    environment:
      TIMESCALE: ${TIMESCALE}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCRAPE: ${FLAGID_SCRAPE}
      TEAM_ID: ${TEAM_ID}
      FLAGID_ENDPOINT: ${FLAGID_ENDPOINT}
      VISUALIZER_URL: ${VISUALIZER_URL:-}
      DUMP_PCAPS: ${DUMP_PCAPS}
    mem_limit: 256m

  assembler:
    build:
      context: services/go-importer
      dockerfile: Dockerfile-assembler
    image: w4rya-assembler:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    # Command line flags most likely to fix a w4rya issue:
    # - -http-session-tracking: enable HTTP session tracking
    # - -dir: directory to read traffic from
    # - -skipchecksum: skip checksum validation
    # - -flush-after: i.e. 2m Not needed in pcap rotation mode
    # - -disable-converters: disable converters
    # - -discard-extra-data: dont split large flow items, just discard them
    command: "./assembler -http-session-tracking -skipchecksum -disable-converters -dir ${TRAFFIC_DIR_DOCKER}"
    environment:
      TIMESCALE: ${TIMESCALE}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCAN: ${FLAGID_SCAN}
      FLAG_LIFETIME: ${FLAG_LIFETIME}
      FLAG_VALIDATOR_TYPE: ${FLAG_VALIDATOR_TYPE}
      FLAG_VALIDATOR_TEAM: ${FLAG_VALIDATOR_TEAM}
      PCAP_OVER_IP: ${PCAP_OVER_IP}
      DUMP_PCAPS: ${DUMP_PCAPS}
      DUMP_PCAPS_INTERVAL: ${DUMP_PCAPS_INTERVAL}
      DUMP_PCAPS_FILENAME: ${DUMP_PCAPS_FILENAME}
      BPF: ${BPF:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1536m

  enricher:
    build:
      context: services/go-importer
      dockerfile: Dockerfile-enricher
    image: w4rya-enricher:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    command: "./enricher -eve ${TRAFFIC_DIR_DOCKER}/eve.json"
    environment:
      TIMESCALE: ${TIMESCALE}
    mem_limit: 384m

volumes:
  timescale-data:

networks:
  internal:
